# Render Blueprint for TSN V1.4.0 + MongoDB Atlas.
# Recommended free-friendly setup: Render Free web service + MongoDB Atlas M0.
# Data is stored in MongoDB, not Render's filesystem, so redeploys/restarts do not wipe accounts/messages.
services:
  - type: web
    name: tsn-social-network
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm cache clean --force && npm install --omit=dev --no-audit --no-fund --prefer-online
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tsn
      - key: MONGODB_STATE_COLLECTION
        value: app_state
      - key: MONGODB_STATE_ID
        value: main
      - key: JWT_SECRET
        generateValue: true
      - key: TSN_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TSN_OLD_DATA_ENCRYPTION_KEYS
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD_HASH
        sync: false
      - key: TSN_CONTENT_FILTER_ENABLED
        value: true
      - key: TSN_BLOCKED_WORDS
        sync: false
      - key: TSN_ANTI_SPAM_ENABLED
        value: true
      - key: TSN_MESSAGE_COOLDOWN_MS
        value: 1500
      - key: TSN_DUPLICATE_MESSAGE_WINDOW_MS
        value: 120000
      - key: TSN_MAX_DUPLICATES_PER_WINDOW
        value: 3
      - key: TSN_SPAM_WINDOW_MS
        value: 60000
      - key: TSN_MAX_MESSAGES_PER_SPAM_WINDOW
        value: 20
      - key: TSN_AUTO_MUTE_AFTER_WARNINGS
        value: 5
      - key: TSN_AUTO_MUTE_MINUTES
        value: 10
      - key: TSN_DEFAULT_ADMIN_MUTE_MINUTES
        value: 10
      - key: TSN_MAX_CUSTOM_BADGES_PER_USER
        value: 6
      - key: TSN_NOTIFICATION_LIMIT
        value: 3000
      - key: TSN_WARNINGS_LIMIT
        value: 1000
