# Render Blueprint for TSN V1.3.1 + MongoDB Atlas + TSN-S wallet sharing.
# Recommended free-friendly setup: Render Free web service + MongoDB Atlas M0.
# Data is stored in MongoDB, not Render's filesystem, so redeploys/restarts do not wipe accounts/messages.
services:
  - type: web
    name: tsn-social-network
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm cache clean --force && npm install --omit=dev --no-audit --no-fund --prefer-online
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tsn
      - key: MONGODB_STATE_COLLECTION
        value: app_state
      - key: MONGODB_STATE_ID
        value: main
      - key: TSNS_MONGODB_URI
        sync: false
      - key: TSNS_MONGODB_DATABASE
        value: tsn_stock
      - key: TSNS_WALLET_COLLECTION
        value: tsnMoneyWallets
      - key: JWT_SECRET
        generateValue: true
      - key: TSN_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TSN_OLD_DATA_ENCRYPTION_KEYS
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD_HASH
        sync: false
      - key: TSN_CONTENT_FILTER_ENABLED
        value: true
      - key: TSN_BLOCKED_WORDS
        sync: false
