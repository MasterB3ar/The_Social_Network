# Render Free + MongoDB Atlas M0.
# This is free-friendly and keeps data in MongoDB instead of the Render filesystem.
services:
  - type: web
    name: tsn-social-network
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tsn
      - key: MONGODB_STATE_COLLECTION
        value: app_state
      - key: MONGODB_STATE_ID
        value: main
      - key: JWT_SECRET
        generateValue: true
      - key: TSN_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TSN_OLD_DATA_ENCRYPTION_KEYS
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD_HASH
        sync: false
      - key: TSN_CONTENT_FILTER_ENABLED
        value: true
      - key: TSN_BLOCKED_WORDS
        sync: false
