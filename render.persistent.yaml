# Legacy fallback: Render paid web service + persistent disk + JSON storage.
# MongoDB Atlas is now recommended instead. Use render.yaml for MongoDB.
services:
  - type: web
    name: tsn-social-network
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm cache clean --force && npm install --omit=dev --no-audit --no-fund --prefer-online
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: tsn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: TSN_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TSN_OLD_DATA_ENCRYPTION_KEYS
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD_HASH
        sync: false
      - key: TSN_CONTENT_FILTER_ENABLED
        value: true
      - key: TSN_BLOCKED_WORDS
        sync: false
      - key: TSN_ANTI_SPAM_ENABLED
        value: true
      - key: TSN_MESSAGE_COOLDOWN_MS
        value: 1500
      - key: TSN_DUPLICATE_MESSAGE_WINDOW_MS
        value: 120000
      - key: TSN_MAX_DUPLICATES_PER_WINDOW
        value: 3
      - key: TSN_SPAM_WINDOW_MS
        value: 60000
      - key: TSN_MAX_MESSAGES_PER_SPAM_WINDOW
        value: 20
      - key: TSN_AUTO_MUTE_AFTER_WARNINGS
        value: 5
      - key: TSN_AUTO_MUTE_MINUTES
        value: 10
      - key: TSN_DEFAULT_ADMIN_MUTE_MINUTES
        value: 10
