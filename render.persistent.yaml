# Legacy fallback: Render paid web service + persistent disk + JSON storage.
# MongoDB Atlas is now recommended instead. Use render.yaml for MongoDB.
services:
  - type: web
    name: tsn-social-network
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm cache clean --force && npm install --omit=dev --no-audit --no-fund --prefer-online
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: tsn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: DATA_DIR
        value: /var/data
      - key: TSNS_MONGODB_URI
        sync: false
      - key: TSNS_MONGODB_DATABASE
        value: tsn_stock
      - key: TSNS_WALLET_COLLECTION
        value: tsnMoneyWallets
      - key: JWT_SECRET
        generateValue: true
      - key: TSN_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TSN_OLD_DATA_ENCRYPTION_KEYS
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD
        sync: false
      - key: TSN_ADMIN_SETUP_PASSWORD_HASH
        sync: false
      - key: TSN_CONTENT_FILTER_ENABLED
        value: true
      - key: TSN_BLOCKED_WORDS
        sync: false
